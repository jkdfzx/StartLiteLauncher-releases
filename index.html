const LANG_KEY = 'startlitelauncher.downloadLang';

/** 瀏覽器語言對應到上面的語言：繁體（台灣、香港、澳門、Hant）、簡體、pt → pt-BR，其餘取主語言，找不到用英文 */
function detectLanguage() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && TEXT[saved]) return saved;
  } catch (e) {}
  for (const raw of navigator.languages || [navigator.language || 'en']) {
    const tag = raw.toLowerCase();
    if (tag.startsWith('zh')) return /hant|tw|hk|mo/.test(tag) ? 'zh-TW' : 'zh-CN';
    if (tag.startsWith('pt')) return 'pt-BR';
    const base = tag.split('-')[0];
    if (TEXT[base]) return base;
  }
  return 'en';
}

let latestVersion = '';

function render(lang) {
  const text = TEXT[lang];
  document.documentElement.lang = lang;
  document.title = 'StartLite Launcher — ' + text.download;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = text[el.dataset.t]; });
  document.getElementById('version').textContent = latestVersion ? text.version.replace('{v}', latestVersion) : '';
}

const select = document.getElementById('lang');
for (const [code, text] of Object.entries(TEXT)) select.add(new Option(text.name, code));
let current = detectLanguage();
select.value = current;
select.addEventListener('change', () => {
  current = select.value;
  try { localStorage.setItem(LANG_KEY, current); } catch (e) {}
  render(current);
});
render(current);

// 最新版本號：讀同一個網站的 version.json（和 App 檢查更新相同）；讀不到時不顯示，不影響下載
fetch('version.json', { cache: 'no-store' })
  .then((res) => (res.ok ? res.json() : null))
  .then((info) => {
    if (info && info.latestName) {
      latestVersion = info.latestName;
      render(current);
    }
  })
  .catch(() => {});
</script>
